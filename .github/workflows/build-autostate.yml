# .github/workflows/build-autostate.yml
#
# Builds the patched fceumm_libretro core for:
#   • Windows 64-bit  (MinGW cross-compile on Ubuntu)
#   • Windows 32-bit  (MinGW cross-compile on Ubuntu)
#   • Linux 64-bit
#   • Android arm64-v8a
#   • Android armeabi-v7a
#   • Android x86_64
#
# Artifacts are uploaded so you can download them directly from the
# GitHub Actions run page without needing a release.
#
# Trigger: every push and pull-request, plus manual dispatch.

name: Build fceumm autostate

on:
  push:
  pull_request:
  workflow_dispatch:      # allows one-click manual runs from the Actions tab

jobs:
  # ------------------------------------------------------------------ #
  # Windows 64-bit (MinGW cross-compile)                               #
  # ------------------------------------------------------------------ #
  build-win64:
    name: Windows x64 (MinGW)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW-w64 toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            make

      - name: Build
        run: |
          make -f Makefile.libretro \
               platform=windows_x86_64 \
               CC=x86_64-w64-mingw32-gcc \
               CXX=x86_64-w64-mingw32-g++ \
               -j$(nproc)

      - name: Rename artifact
        run: mv fceumm_libretro.dll fceumm_libretro_win64.dll 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fceumm_libretro_win64
          path: fceumm_libretro_win64.dll

  # ------------------------------------------------------------------ #
  # Windows 32-bit (MinGW cross-compile)                               #
  # ------------------------------------------------------------------ #
  build-win32:
    name: Windows x86 (MinGW)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW-w64 toolchain (32-bit)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-i686 \
            g++-mingw-w64-i686 \
            make

      - name: Build
        run: |
          make -f Makefile.libretro \
               platform=windows_x86 \
               CC=i686-w64-mingw32-gcc \
               CXX=i686-w64-mingw32-g++ \
               -j$(nproc)

      - name: Rename artifact
        run: mv fceumm_libretro.dll fceumm_libretro_win32.dll 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fceumm_libretro_win32
          path: fceumm_libretro_win32.dll

  # ------------------------------------------------------------------ #
  # Linux 64-bit                                                       #
  # ------------------------------------------------------------------ #
  build-linux64:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            make

      - name: Build
        run: |
          make -f Makefile.libretro \
               platform=unix \
               -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fceumm_libretro_linux64
          path: fceumm_libretro.so

  # ------------------------------------------------------------------ #
  # Android — arm64-v8a / armeabi-v7a / x86_64                        #
  #                                                                    #
  # Uses ndk-build (the repo already ships jni/Android.mk).           #
  # ndk-build outputs to:  libs/<abi>/libretro.so                     #
  # We rename it to the RetroArch convention before uploading.        #
  # ------------------------------------------------------------------ #
  build-android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest ships the Android SDK + cmdline-tools.
      # We install a pinned NDK then run ndk-build directly.
      - name: Install NDK
        run: |
          NDK_VER="26.3.11579264"
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "ndk;${NDK_VER}" 2>&1 | tail -3
          echo "NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VER}" >> $GITHUB_ENV

      - name: Install make
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends make

      # ndk-build reads jni/Android.mk and jni/Application.mk.
      # We override APP_ABI on the command line so only one ABI is built
      # per matrix job (faster, cleaner artifacts).
      # APP_PLATFORM=android-21 covers all three target ABIs.
      - name: Build with ndk-build
        run: |
          ${NDK_ROOT}/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            APP_ABI="${{ matrix.abi }}" \
            APP_PLATFORM=android-21 \
            APP_OPTIM=release \
            -j$(nproc)

      # ndk-build puts the result at:  libs/<abi>/libretro.so
      # RetroArch on Android expects:  fceumm_libretro_android.so
      # We add the ABI suffix so all three don't overwrite each other.
      - name: Rename artifact
        run: |
          cp libs/${{ matrix.abi }}/libretro.so \
             fceumm_libretro_android_${{ matrix.abi }}.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fceumm_libretro_android_${{ matrix.abi }}
          path: fceumm_libretro_android_${{ matrix.abi }}.so
